# Se corre JUNTO con docker-compose.yml, no en reemplazo:
#   docker-compose -f docker-compose.yml -f docker-compose-airflow.yml up -d --build
#
# Así todos los servicios (api, mlflow-ui, streamlit, postgres, airflow-*)
# quedan en la misma red de Docker y se pueden resolver por nombre
# (ej: la API le habla a Airflow, y viceversa, sin exponer puertos extra).

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    MLFLOW_TRACKING_URI: sqlite:////mlflow_data/mlflow.db
    DATA_PATH: /app/data/Telco-Customer-Churn.csv
    MONITORING_DB_PATH: /app/monitoring/predictions.db
    REPORTS_DIR: /app/reports
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/app/data
    - ./models:/app/models
    - ./mlflow_data:/mlflow_data
    - ./monitoring:/app/monitoring
    - ./reports:/app/reports
    - ./src:/app/src
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password airflow
        echo "✅ Airflow inicializado"

volumes:
  postgres-db-volume:
