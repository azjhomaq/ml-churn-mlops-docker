version: '3.8'

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      # Usa un volumen para la base de datos, no un montaje directo
      - mlflow-data:/app
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///app/mlflow.db
    command: python src/train.py

  mlflow-ui:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      # Monta el mismo volumen
      - mlflow-data:/app
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///app/mlflow.db
    command: >
      sh -c "pip install --no-cache-dir mlflow>=2.0.0 && 
             mlflow ui --backend-store-uri sqlite:///app/mlflow.db --host 0.0.0.0 --port 5000"
    depends_on:
      - train

  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./models:/app/models
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/model.joblib
      - SCALER_PATH=/app/models/scaler.joblib
      - ENCODER_PATH=/app/models/label_encoders.joblib
    depends_on:
      - train
    restart: unless-stopped

# Define el volumen aquí
volumes:
  mlflow-data: